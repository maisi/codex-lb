# Place behind your TLS ingress. Keep backend addresses private and reachable
# from the load balancer and each peer. Replace these example addresses.
global
    maxconn 1000
    nbthread 1

defaults
    mode http
    timeout connect 2s
    timeout client 2h
    timeout server 2h
    # An upstream may already have accepted a POST. Retry remains a client
    # decision; never automatically replay an uncertain generation here.
    retries 0

frontend codex
    bind 127.0.0.1:2455
    http-request deny if { path_beg /internal/ }
    default_backend codex_instances

backend codex_instances
    balance roundrobin
    cookie CODEX_LB_NODE insert indirect nocache httponly
    option httpchk GET /health/ready
    http-check expect status 200
    server ha-a 10.20.0.11:2455 cookie ha-a check inter 1s fall 2 rise 2
    server ha-b 10.20.0.12:2455 cookie ha-b check inter 1s fall 2 rise 2
